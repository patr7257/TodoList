name: CI

# PR-level gate: main only receives code that builds and passes the full test
# reactor. Since issue #66 there is no desktop client and no installer release,
# so this is the only workflow in the repo; merging to main redeploys the API on
# Dokploy and nothing else.
on:
  pull_request:
  # main IS production here: a merge redeploys the API on Dokploy and Flyway
  # applies any pending migration against production Neon at boot. A pull
  # request is tested against its own head, not against the merge result, so two
  # green pull requests can still produce a broken main. Verifying the push
  # cannot prevent that, but it reports it in about two minutes rather than
  # leaving the website to discover it. See issue #81.
  push:
    branches: [main]

# A superseded run tells you nothing, so cancel it rather than queue it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test all modules
        run: mvn -B clean verify
